name: Deploy to GitHub Pages

# 推送 main 时发布游戏：只发布运行需要的文件，编辑器（_server、editor.html、server.py）和工具不发布。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Collect runtime files
        run: |
          mkdir -p _site
          cp -R index.html main.js styles.css logo.png logoDefault.png hkbdt.ttf ubuntu.ttf libs project _site/
          # 版本号换成提交号，脚本和图片的 ?v= 跟着变，玩家不会拿到旧缓存
          sed -i "s/this.version = \"[^\"]*\"/this.version = \"${GITHUB_SHA::7}\"/" _site/main.js
          grep -n 'this.version = ' _site/main.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
